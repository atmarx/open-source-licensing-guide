# Open Source Licensing Guide — Deploy to Production (xdroplet04)
#
# SSHs into xdroplet04, syncs the working tree to /opt/projects/open-source-licensing-guide,
# pulls the image from Gitea CR, brings the compose stack up, drops the
# Caddy site config into /opt/caddy-stack/sites/ and reloads Caddy.
#
# Triggers on tag (production releases only).
# Accessible at libre.xram.net

when:
  - event: tag

labels:
  host: xdocker01

depends_on:
  - build

steps:
  - name: deploy-production
    image: alpine:latest
    environment:
      DROPLET_SSH_KEY:
        from_secret: droplet04_ssh_key
      DROPLET_HOSTINFO:
        from_secret: droplet04_hostinfo
    commands:
      - apk add --no-cache openssh-client rsync
      - 'export DROPLET_IP=$(echo "$DROPLET_HOSTINFO" | cut -d"|" -f1)'
      - 'export DROPLET_HOST=$(echo "$DROPLET_HOSTINFO" | cut -d"|" -f2)'
      - mkdir -p ~/.ssh
      - echo "$DROPLET_SSH_KEY" > ~/.ssh/id_ed25519
      - chmod 600 ~/.ssh/id_ed25519
      - ssh-keyscan -H "$DROPLET_HOST" "$DROPLET_IP" >> ~/.ssh/known_hosts 2>/dev/null
      - ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "mkdir -p /opt/projects/open-source-licensing-guide/caddy /opt/projects/open-source-licensing-guide/_staged"
      - rsync -az docker-compose.production.yml caddy/open-source-licensing-guide.caddy scripts/deploy-production.sh deploy@"$DROPLET_HOST":/opt/projects/open-source-licensing-guide/_staged/
      - ssh -o StrictHostKeyChecking=accept-new deploy@"$DROPLET_HOST" "bash /opt/projects/open-source-licensing-guide/_staged/deploy-production.sh"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
